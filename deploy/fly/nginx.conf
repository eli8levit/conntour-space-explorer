# Fly copy of frontend/nginx.conf (see frontend/fly.toml). Keep the two in step.

# Write limit: 10 searches/deletes per minute per visitor. The Worker's rate-limit binding
# did not block in practice, so the origin enforces it too. X-Client-IP is set by the Worker;
# a request without the Worker's secret never gets this far (403). GET requests map to an
# empty key, which nginx does not count.
map $request_method $write_client {
    POST    $http_x_client_ip;
    DELETE  $http_x_client_ip;
    default "";
}
limit_req_zone $write_client zone=writes:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version in the Server header or on error pages.
    server_tokens off;

    # Security headers on every response, errors too (`always`). Careful: a location
    # with its own add_header drops all of these, so the asset location repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Production only: deploy/nginx/origin-guard.conf.template is rendered into this folder,
    # so the origin answers only requests that came through the Cloudflare Worker.
    # Locally the folder is empty and nothing changes.
    include /etc/nginx/guard/*.conf;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Fly: the backend is another app on the private (IPv6) network. A variable in
    # proxy_pass makes nginx resolve the name at request time with Fly's DNS, so a
    # restarted backend with a new address is found again.
    resolver [fdaa::3]:53 valid=10s ipv6=on;
    location /api/ {
        # 10 at once, then one more every 6 s. Over that: 429.
        limit_req zone=writes burst=9 nodelay;
        limit_req_status 429;
        set $api http://nightcoding-homework-api.internal:5001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files and handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The web app manifest: nginx's mime.types has no entry for .webmanifest.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated from the server block: this add_header would otherwise drop them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
