server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version in the Server header or on error pages.
    server_tokens off;

    # Security headers on every response, errors too (`always`). Careful: a location
    # with its own add_header drops all of these, so the asset location repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Production only: deploy/nginx/origin-guard.conf.template is rendered into this folder,
    # so the origin answers only requests that came through the Cloudflare Worker.
    # Locally the folder is empty and nothing changes.
    include /etc/nginx/guard/*.conf;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static files and handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The web app manifest: nginx's mime.types has no entry for .webmanifest.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated from the server block: this add_header would otherwise drop them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
