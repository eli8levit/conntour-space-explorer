# nginx with the built frontend on Fly (deploy from frontend/: `fly deploy --ha=false`).
# The Cloudflare Worker on homework.nightcoding.dev is the only client: it sends
# X-Origin-Secret, and the guard answers 403 to anything else. Secret: ORIGIN_SECRET.
app = "nightcoding-homework-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  # The official nginx image renders /etc/nginx/templates/*.template into this folder at start.
  NGINX_ENVSUBST_OUTPUT_DIR = "/etc/nginx/guard"

# Fly's copy of nginx.conf: the same, except /api goes to the backend over the private network.
[[files]]
  guest_path = "/etc/nginx/conf.d/default.conf"
  local_path = "../deploy/fly/nginx.conf"

[[files]]
  guest_path = "/etc/nginx/templates/origin-guard.conf.template"
  local_path = "../deploy/nginx/origin-guard.conf.template"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
