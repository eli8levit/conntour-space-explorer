<style>
body{margin:0;background:#09090A}
a{color:#E9E7E2}a:hover{color:#FF5A1F}

<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #09090A; color: #E9E7E2; font-family: 'Instrument Sans', system-ui, sans-serif; letter-spacing: 0.006em; box-sizing: border-box">

  <div class="drift" style="position: absolute; left: -262px; top: -96px; width: 1976px; display: grid; grid-template-columns: repeat(16, 116px); grid-auto-rows: 116px; grid-auto-flow: dense; gap: 8px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="100">
      <div style="{{t.cell}}">
        <div style="width: 100%; height: 100%; overflow: hidden; background: #141416"><img src="{{t.src}}" alt="" style="{{t.img}}"></div>
        <sc-if value="{{t.big}}" hint-placeholder-val="{{false}}">

        </sc-if>
        <sc-if value="{{t.hot}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; left: -6px; top: -6px; width: 14px; height: 14px; border-left: 1.5px solid #FF5A1F; border-top: 1.5px solid #FF5A1F"></span>
          <span style="position: absolute; right: -6px; top: -6px; width: 14px; height: 14px; border-right: 1.5px solid #FF5A1F; border-top: 1.5px solid #FF5A1F"></span>

          <span style="position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; border-right: 1.5px solid #FF5A1F; border-bottom: 1.5px solid #FF5A1F"></span>

          <span style="position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(255, 90, 31, 0.55)"></span>
          <div style="position: absolute; left: calc(100% + 14px); top: 10px; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; z-index: 3">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 64px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: rgba(9, 9, 10, 0.82); backdrop-filter: blur(14px); border-bottom: 1px solid #1C1C1F; z-index: 5">

    <span style="writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px">History · 24</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8C86" stroke-width="1.8" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(to bottom, rgba(9, 9, 10, 0), rgba(9, 9, 10, 0.95) 55%); z-index: 3; pointer-events: none"></div>

  <div style="position: absolute; left: 380px; bottom: 36px; width: 680px; z-index: 4; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 11px; color: #A6A49E; padding: 0 4px">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF5A1F" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="q-a1" style="position: absolute; left: -9999px">Query the archive</label>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {

      algeria:'/_blob/d0738f6b198a81c241628291c687dab3', apollo15:'/_blob/331621360562dc47da2a988c36e7b4bc', atlantis:'/_blob/786de553c11109623c0fe20f3f7b926b',

      gale:'/_blob/6612e925d55fa549b658648f8d0c797d', ganges:'/_blob/053dd6c0d6e2951ee273b5976c91e3e9', guppy:'/_blob/e66af121e69fb320b5c356cd7d79fc45',
      lmsim:'/_blob/0b8d6c6e07e7aac0e11f39df82052909', lunar:'/_blob/47491645b54729a81e25c70e2bbdc2f9', marbles:'/_blob/644c453a3d887475cf810b918acccbb5',
      ophir:'/_blob/26867f03197d598b3bf884457f6fa1a5', parker:'/_blob/513c1b42ac6f5cf617afc99505431ac5', saturn:'/_blob/5f6422d15378b30d9015997e4db5919f',
      soyuz:'/_blob/566d175c3b4f7700587785452b7ff26c', storm:'/_blob/5d1d57a20e6d8191b824b6f6ad6c1676', vesta:'/_blob/8c9ebf22ac6dc237ce43893799658302'
    };
    var META = {
      gale: ['Gale Crater', 'PIA22505 · JPL · 2018'], ganges: ['Ganges Chasma', 'PIA13637 · JPL · 2010'], ophir: ['Ophir Chasma Dunes', 'PIA05956 · JPL · 2004'],
      saturn: ['Saturn’s hexagon in infrared', 'PIA17654 · JPL · 2013'], vesta: ['Small, dark asteroids', 'PIA14732 · JPL · 2011'], algeria: ['Flooding in Algeria', 'PIA13962 · JPL · 2012'],
      storm: ['Spring storm, New England', 'GSFC · 2017'], columbia: ['Columbia, STS 61-C', '61c-s-047 · JSC · 1986'], atlantis: ['Atlantis, STS-129', 'sts129-s-077 · JSC · 2009'],
      eva: ['Herrington, second EVA', 'S113E05187 · JSC · 2002'], parker: ['Parker Solar Probe', 'KSC · 2018'], lunar: ['Lunar landing testing', 'LRC · 1965'],
      lmsim: ['LM mission simulator', 'S67-15795 · JSC · 1967'], guppy: ['Orion on the Super Guppy', 'GRC · 2019'], soyuz: ['Expedition 61 Soyuz landing', 'HQ · 2020'],
      delta: ['Delta IV Heavy, EFT-1', 'KSC · 2014'], marbles: ['Perseverance marble countdown', 'HQ · 2021'], apollo15: ['Apollo 15 crew', '7120051 · MSFC · 1971']
    };
    var names = ['storm','eva','delta','apollo15','saturn','lunar','soyuz','ganges','columbia','guppy','parker','ophir','atlantis','lmsim','marbles'];
    var once = { 22: 'vesta', 77: 'algeria' };
    var tiles = [];
    for (var i = 0; i < 100; i++) {
      var h = (i * 2654435761) >>> 0;
      var hot = i === 21;
      var n = hot ? 'gale' : (once[i] || names[(i * 4) % names.length]);
      var r = (h >>> 11) % 100;
      var cs = 1, rs = 1;
      if (hot) { cs = 2; rs = 3; }
      else if (r < 12) { cs = 3; rs = 2; }
      else if (r < 30) { cs = 2; rs = 2; }
      else if (r < 46) { cs = 2; rs = 1; }
      else if (r < 60) { cs = 1; rs = 2; }
      var big = cs * rs >= 4;
      var px = (h >>> 5) % 100, py = (h >>> 9) % 100;
      tiles.push({
        hot: hot, big: big && !hot, small: !big && !hot,
        no: ('00' + (i + 1)).slice(-3),
        title: META[n][0], meta: META[n][1],
        src: C[n],

      });
    }
    return { tiles: tiles };
  }
}
